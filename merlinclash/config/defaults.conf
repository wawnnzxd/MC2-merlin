# MC2 默认配置 —— 从主路由 GT-BE96 迁移(2026-08-25)
# install.sh 逐行应用,仅在键不存在时写入(不覆盖用户已有配置)
#
# ⚠️⚠️ 全局策略键:必须有,少了代理就是"跑起来但不生效"
# merlinclash_nokpacl_default_mode 决定「不在白名单里的剩余主机」走不走代理。
# 缺省会被脚本置 0 = 不走 —— 此时 apply_nat_rules **不生成 merlinclash 链的兜底跳转**,
# 只有白名单设备能代理,路由器自身和其它设备全部直连。
# 现象极具迷惑性:内核在跑、iptables 有 30 条链、dnsmasq 也接管了、DNS 解析干净,
# 但 google 就是超时,而 api.anthropic.com 反而通(它有国内可达的 CDN 边缘)。
# 2026-08-25 首次真机启用时踩到,查了七八轮才定位到这一个键。
# 教训:排除 nokpacl_* 时要**区分「设备条目」和「全局策略」** ——
#       nokpacl_{ip,mac,name,port,mode}_<N> 是具体设备,不该迁;
#       nokpacl_default_* 和 nokpacl_method 是全局开关,必须迁。
merlinclash_nokpacl_default_mode=1
merlinclash_nokpacl_default_port=all
merlinclash_nokpacl_method=1

# 有意排除:
#   nokpacl_{ip,mac,name,port,mode}_<N>(128个)  主路由的**具体设备**绕行条目,与本机设备无关
#   (注意:上面三个 nokpacl_default_* / _method 是全局策略,不在排除之列)
#   sub_links          机场订阅地址(含 token),由用户在页面自行填写
#   db_* / binary_* / version / lockfile / action / trigger  运行态,非配置

# ── 总开关:默认关闭 ──
# 本机是二级路由(WAN 接主路由 LAN),主路由上 MC2 也在跑。
# 两级同时开代理会造成双重代理,所以装完不自动启动,由用户决定何时开。
merlinclash_enable=0

# ── 进程守护:必须为 0 ──
# 上游用 perp 守护(koolshare 固件私有),原版梅林没有。
# 置 0 走 startClashNormalOrPerp() 的 normal 分支,直接后台启动。
merlinclash_set_watchdog_sw=0

# ── 其余配置沿用主路由 ──
merlinclash_bak_acl=1
merlinclash_bak_db=1
merlinclash_bak_dns=1
merlinclash_bak_rule=1
merlinclash_bak_set=1
merlinclash_bak_yaml=1
merlinclash_dns_cleardns_sw=1
merlinclash_dns_dnshijack_sw=1
merlinclash_dns_fakeip_server=223.5.5.5
merlinclash_dns_proxydns_sw=1
merlinclash_dns_sniffer_sw=1
merlinclash_dns_type=rh
merlinclash_ipt_closeproxy_sw=0
merlinclash_ipt_ipv6_sw=0
merlinclash_ipt_proxyiot_sw=0
merlinclash_ipt_proxyrouter_sw=1
merlinclash_ipt_routingmark_val=255
merlinclash_ipt_tproxy_type=udp
merlinclash_select_clash_restart=2
merlinclash_select_clash_restart_day=1
merlinclash_select_clash_restart_hour=12
merlinclash_select_clash_restart_minute=0
merlinclash_select_clash_restart_minute_2=2
merlinclash_select_clash_restart_week=1
merlinclash_set_chnroute_sw=1
merlinclash_set_dashboard_password=clash
merlinclash_set_geoip_type=full
merlinclash_set_geosite_type=full
merlinclash_set_interval_sw=0
merlinclash_set_interval_val=300
merlinclash_set_logcheck_sw=0
